# Smoke-only overrides. Never use in production.
services:
  harness:
    depends_on:
      github-mcp:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy

  github-mcp:
    environment:
      GITHUB_API_BASE_URL: http://mock-github:8081
    depends_on:
      mock-github:
        condition: service_healthy

  rag-mcp:
    environment:
      RAG_MOCK_BACKEND: "true"

  mock-github:
    image: python:3.12-slim-bookworm
    command: ["python", "/mock/mock_github_server.py"]
    volumes:
      - ./scripts/mock_github_server.py:/mock/mock_github_server.py:ro
    networks:
      - harness_internal
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
